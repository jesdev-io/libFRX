site_name: libFRX
site_description: Embedded audio, DSP, and hardware utility library
repo_url: https://github.com/jesdev-io/libFRX

docs_dir: docs
site_dir: ./site

exclude_docs: |
  mkdocs.yml
  templates/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - API Reference:
      - Overview: reference/index.md
      - Configuration: reference/configuration.md
      - Audio: reference/audio.md
      - DSP: reference/dsp_frx.md
      - External Flash: reference/ext_flash.md
      - I2C: reference/i2c.md
      - SD Card: reference/sdcard.md
      - Synth: reference/synth.md
      - Utils: reference/utils.md
      - WAV: reference/wav.md
  - Examples:
      - Overview: examples/index.md
      - Audio Demo App: examples/audio_demo.md
      - SD Card Demo App: examples/sdcard_demo.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: docs

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
