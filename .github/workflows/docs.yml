name: docs

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install ".[docs]"

      - name: Build expanded MkDocs site
        run: python shared/scripts/build_mkdocs_site.py --build

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: >-
          mkdocs gh-deploy
          --force
          --config-file .mkdocs-build/prepared/mkdocs.yml
          --site-dir .mkdocs-build/site
