; PlatformIO Project Configuration File for libFRX
; A modular shared library for FRX ecosystem devices

; ============================================================================
; Base Configuration
; ============================================================================
[_env]
platform = espressif32
framework = arduino
extra_scripts = pre:shared/scripts/get_time.py
lib_deps =
    jescore@2.3.0
build_flags =
    -Ilib/audio
    -Ilib/dsp_frx
    -Ilib/ext_flash
    -Ilib/i2c
    -Ilib/sdcard
    -Ilib/synth
    -Ilib/syserr
    -Ilib/utils
    -Ilib/wav
    -DFRX_ENABLE_MODULE_SYSERR

; ============================================================================
; FR1-mini Configuration
; ============================================================================
[env:fr1_base]
extends = _env
board = esp-wrover-kit
build_flags =
    ${_env.build_flags}
    ; Audio pins (FR1-mini)
    -DAUDIO_I2S_PORT=0
    -DAUDIO_PIN_MEMS_I2S_BCLK=23
    -DAUDIO_PIN_MEMS_I2S_WS=4
    -DAUDIO_PIN_MEMS_I2S_IN=27
    ; I2C pins
    -DI2C_BASE_SCL=21
    -DI2C_BASE_SDA=20
    -DI2C_BASE_NUM=0
    ; SDCard (SPI mode)
    -DSDCARD_MODE=sd_mode_spi
    -DSDCARD_SPI_PIN_CS=13
    -DSDCARD_SPI_PIN_MOSI=15
    -DSDCARD_SPI_PIN_MISO=2
    -DSDCARD_SPI_PIN_SCK=14

[env:fr1_test_audio]
extends = env:fr1_base
build_src_filter = -<*> +<test/test_audio_fw.cpp>

[env:fr1_test_dsp_frx]
extends = env:fr1_base
build_src_filter = -<*> +<test/test_dsp_frx_fw.cpp>

[env:fr1_test_i2c]
extends = env:fr1_base
build_src_filter = -<*> +<test/test_i2c_fw.cpp>

[env:fr1_test_sdcard]
extends = env:fr1_base
build_src_filter = -<*> +<test/test_sdcard_fw.cpp>

[env:fr1_test_utils]
extends = env:fr1_base
build_src_filter = -<*> +<test/test_utils_fw.cpp>

; ============================================================================
; FR2 Configuration
; ============================================================================
[env:fr2_base]
extends = _env
board = esp32-s3-devkitc-1
platform_packages =
    platformio/toolchain-xtensa@^2.100300.220621
    tool-esptoolpy@~1.40501.0
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ${_env.build_flags}
    ; Audio pins (FR2)
    -DAUDIO_I2S_PORT=0
    -DAUDIO_PIN_MEMS_I2S_BCLK=15
    -DAUDIO_PIN_MEMS_I2S_WS=17
    -DAUDIO_PIN_MEMS_I2S_IN=16
    ; I2C pins
    -DI2C_BASE_SCL=21
    -DI2C_BASE_SDA=20
    -DI2C_BASE_NUM=0
    ; External Flash pins
    -DEF_SPI_HOST=1
    -DEF_PIN_MISO=46
    -DEF_PIN_MOSI=11
    -DEF_PIN_SCLK=12
    -DEF_PIN_CS=14
    ; SDCard (SDMMC mode)
    -DSDCARD_MODE=sd_mode_sdmmc
    -DSDCARD_SDMMC_PIN_CLK=36
    -DSDCARD_SDMMC_PIN_CMD=35
    -DSDCARD_SDMMC_PIN_D0=37
    -DSDCARD_SDMMC_PIN_D1=38
    -DSDCARD_SDMMC_PIN_D2=45
    -DSDCARD_SDMMC_PIN_D3=39

[env:fr2_test_audio]
extends = env:fr2_base
build_src_filter = -<*> +<test/test_audio_fw.cpp>

[env:fr2_test_dsp_frx]
extends = env:fr2_base
build_src_filter = -<*> +<test/test_dsp_frx_fw.cpp>

[env:fr2_test_ext_flash]
extends = env:fr2_base
build_flags =
    ${env:fr2_base.build_flags}
    -DFRX_ENABLE_MODULE_EXT_FLASH
build_src_filter = -<*> +<test/test_ext_flash_fw.cpp>
test_filter = test_ext_flash

[env:fr2_test_i2c]
extends = env:fr2_base
build_src_filter = -<*> +<test/test_i2c_fw.cpp>

[env:fr2_test_sdcard]
extends = env:fr2_base
build_src_filter = -<*> +<test/test_sdcard_fw.cpp>

[env:fr2_test_synth]
extends = env:fr2_base
build_src_filter = -<*> +<test/test_synth_fw.cpp>
build_flags =
    ${env:fr2_base.build_flags}
    -O3
    -ffast-math

[env:fr2_test_utils]
extends = env:fr2_base
build_src_filter = -<*> +<test/test_utils_fw.cpp>

[env:fr2_test_wav]
extends = env:fr2_base
build_src_filter = -<*> +<test/test_wav_fw.cpp>

; ============================================================================
; Generic Test Environments (for development)
; ============================================================================
[env:esp32dev]
extends = _env
board = esp32dev

[env:esp-wrover-kit]
extends = _env
board = esp-wrover-kit

[env:esp32-s3-devkitc-1]
extends = _env
board = esp32-s3-devkitc-1
