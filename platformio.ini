; PlatformIO Project Configuration File for libFRX
; A modular shared library for FRX ecosystem devices

[platformio]
default_envs = frx_all

; ============================================================================
; Base Configuration
; ============================================================================
[_env]
platform = espressif32
framework = arduino
extra_scripts = pre:shared/scripts/get_time.py
                pre:shared/scripts/jccl_macro_parser.py
build_src_filter = -<*>
platform_packages =
    platformio/toolchain-xtensa@^2.100300.220621
    tool-esptoolpy@~1.40501.0
lib_deps =
    jescore@2.3.2-post.2
build_flags =
    -Ilib/audio
    -Ilib/dsp_frx
    -Ilib/ext_flash
    -Ilib/fsm_tools
    -Ilib/i2c
    -Ilib/sdcard
    -Ilib/synth
    -Ilib/syserr
    -Ilib/utils
    -Ilib/wav
    -Iinclude
    -DJES_LOG_LEN=16
    -DFRX_FW_VER_MAJ=0
    -DFRX_FW_VER_MIN=1
    -DFRX_FW_VER_MOD=97 ; 'a'
    -DFR1_SER_NUM=0

; ============================================================================
; FRX board and macro groups
; ============================================================================
[frx_board]
board = esp32-s3-devkitc-1
upload_speed = 921600
monitor_speed = 115200

[frx_hw_audio]
build_flags =
    ; Audio pins
    -DAUDIO_IO_IN_CH=2
    -DAUDIO_IO_OUT_CH=2
    -DAUDIO_PIN_I2S_BCLK=15
    -DAUDIO_PIN_I2S_WS=17
    -DAUDIO_PIN_I2S_IN_A=16
    -DAUDIO_PIN_I2S_OUT_A=6

[frx_hw_i2c]
build_flags =
    ; I2C pins
    -DI2C_BASE_SCL=21
    -DI2C_BASE_SDA=20
    -DI2C_BASE_NUM=0

[frx_hw_ext_flash]
build_flags =
    ; External Flash pins
    -DEF_SPI_HOST=1
    -DEF_PIN_MISO=46
    -DEF_PIN_MOSI=11
    -DEF_PIN_SCLK=12
    -DEF_PIN_CS=14

[frx_hw_sdcard_sdmmc]
build_flags =
    ; SDCard (SDMMC mode)
    -DSDCARD_MODE_SDMMC
    -DSDCARD_SDMMC_PIN_CLK=36
    -DSDCARD_SDMMC_PIN_CMD=35
    -DSDCARD_SDMMC_PIN_D0=37
    -DSDCARD_SDMMC_PIN_D1=38
    -DSDCARD_SDMMC_PIN_D2=45
    -DSDCARD_SDMMC_PIN_D3=39
    '-DSDCARD_DEFAULT_FNAME_WAV="fr2_rec_0000.wav"'

[frx_modules_all]
build_flags =
    -DFRX_ENABLE_MODULE_AUDIO
    -DFRX_ENABLE_MODULE_DSP_FRX
    -DFRX_ENABLE_MODULE_EXT_FLASH
    -DFRX_ENABLE_MODULE_FSM_TOOLS
    -DFRX_ENABLE_MODULE_I2C
    -DFRX_ENABLE_MODULE_RTC_DS3231
    -DFRX_ENABLE_MODULE_SDCARD
    -DFRX_ENABLE_MODULE_SYNTH
    -DFRX_ENABLE_MODULE_UTILS
    -DFRX_ENABLE_MODULE_WAV

; ============================================================================
; Default all-modules firmware for the concrete jesdev.io test setup
; ============================================================================
[env:frx_all]
extends = _env, frx_board
build_src_filter = +<audio_demo.cpp>
build_flags =
    ${_env.build_flags}
    -DUTILS_DEBUG_PRINT_ENABLE
    ${frx_hw_audio.build_flags}
    ${frx_hw_i2c.build_flags}
    ${frx_hw_ext_flash.build_flags}
    ${frx_hw_sdcard_sdmmc.build_flags}
    ${frx_modules_all.build_flags}

; ============================================================================
; Hardware-backed test firmware. Each test env enables only the macros it uses.
; ============================================================================
[env:frx_test_audio]
extends = _env, frx_board
test_filter = test_audio
build_flags =
    ${_env.build_flags}
    ${frx_hw_audio.build_flags}
    -DFRX_ENABLE_MODULE_AUDIO
    -DAUDIO_TIMING_ENABLE

[env:frx_test_dsp_frx]
extends = _env, frx_board
test_filter = test_dsp_frx
build_flags =
    ${_env.build_flags}
    -DFRX_ENABLE_MODULE_DSP_FRX

[env:frx_test_ext_flash]
extends = _env, frx_board
test_filter = test_ext_flash
build_flags =
    ${_env.build_flags}
    ${frx_hw_ext_flash.build_flags}
    -DFRX_ENABLE_MODULE_EXT_FLASH

[env:frx_test_fsm_tools]
extends = _env, frx_board
test_filter = test_fsm_tools
build_flags =
    ${_env.build_flags}
    -DFRX_ENABLE_MODULE_FSM_TOOLS

[env:frx_test_i2c]
extends = _env, frx_board
test_filter = test_i2c
build_flags =
    ${_env.build_flags}
    ${frx_hw_i2c.build_flags}
    -DFRX_ENABLE_MODULE_I2C

[env:frx_test_rtc]
extends = _env, frx_board
test_filter = test_rtc
build_flags =
    ${_env.build_flags}
    ${frx_hw_i2c.build_flags}
    -DFRX_ENABLE_MODULE_I2C
    -DFRX_ENABLE_MODULE_RTC_DS3231

[env:frx_test_sdcard]
extends = _env, frx_board
test_filter = test_sdcard
build_flags =
    ${_env.build_flags}
    ${frx_hw_sdcard_sdmmc.build_flags}
    -DFRX_ENABLE_MODULE_SDCARD
    -DFRX_ENABLE_MODULE_UTILS

[env:frx_test_sdcard_spi]
extends = _env, frx_board
test_filter = test_sdcard
build_flags =
    ${_env.build_flags}
    ; Same ESP32-S3 SD-card socket as SDMMC mode, driven through SPI mode.
    ; SD SPI mapping: CMD=MOSI, CLK=SCK, D0=MISO, D3=CS. D1/D2 unused.
    -DSDCARD_MODE_SPI
    -DSDCARD_SPI_PIN_CS=39
    -DSDCARD_SPI_PIN_MOSI=35
    -DSDCARD_SPI_PIN_MISO=37
    -DSDCARD_SPI_PIN_SCK=36
    '-DSDCARD_DEFAULT_FNAME_WAV="fr2_rec_0000.wav"'
    -DFRX_ENABLE_MODULE_SDCARD
    -DFRX_ENABLE_MODULE_UTILS

[env:frx_test_synth]
extends = _env, frx_board
test_filter = test_synth
build_flags =
    ${_env.build_flags}
    ${frx_hw_audio.build_flags}
    -DFRX_ENABLE_MODULE_AUDIO
    -DFRX_ENABLE_MODULE_SYNTH
    -O3
    -ffast-math

[env:frx_test_utils]
extends = _env, frx_board
test_filter = test_utils
build_flags =
    ${_env.build_flags}
    -DFRX_ENABLE_MODULE_UTILS

[env:frx_test_wav]
extends = _env, frx_board
test_filter = test_wav
build_flags =
    ${_env.build_flags}
    ${frx_hw_audio.build_flags}
    ${frx_hw_sdcard_sdmmc.build_flags}
    -DFRX_ENABLE_MODULE_AUDIO
    -DFRX_ENABLE_MODULE_SDCARD
    -DFRX_ENABLE_MODULE_UTILS
    -DFRX_ENABLE_MODULE_WAV

; ============================================================================
; Demo firmware. Each demo env enables only the macros it uses.
; ============================================================================
[env:frx_demo_sdcard]
extends = _env, frx_board
build_src_filter = +<sdcard_demo.cpp>
build_flags =
    ${_env.build_flags}
    ${frx_hw_sdcard_sdmmc.build_flags}
    -DFRX_ENABLE_MODULE_SDCARD
    -DFRX_ENABLE_MODULE_UTILS

[env:frx_demo_audio]
extends = _env, frx_board
build_src_filter = +<audio_demo.cpp>
build_flags =
    ${_env.build_flags}
    ${frx_hw_audio.build_flags}
    -DFRX_ENABLE_MODULE_AUDIO

[env:frx_demo_ext_flash]
extends = _env, frx_board
build_src_filter = +<ext_flash_demo.cpp>
build_flags =
    ${_env.build_flags}
    ${frx_hw_ext_flash.build_flags}
    -DFRX_ENABLE_MODULE_EXT_FLASH

[env:frx_demo_fsm_tools]
extends = _env, frx_board
build_src_filter = +<fsm_tools_demo.cpp>
build_flags =
    ${_env.build_flags}
    -DFRX_ENABLE_MODULE_FSM_TOOLS

[env:frx_demo_i2c]
extends = _env, frx_board
build_src_filter = +<i2c_demo.cpp>
build_flags =
    ${_env.build_flags}
    ${frx_hw_i2c.build_flags}
    -DFRX_ENABLE_MODULE_I2C

[env:frx_demo_rtc]
extends = _env, frx_board
build_src_filter = +<rtc_demo.cpp>
build_flags =
    ${_env.build_flags}
    ${frx_hw_i2c.build_flags}
    -DFRX_ENABLE_MODULE_I2C
    -DFRX_ENABLE_MODULE_RTC_DS3231
